[project]
name = "frog-classifier"
version = "0.1.0"
description = "Tools for preparing, labeling, training, and analyzing frog-call recordings."
requires-python = ">=3.13,<3.14"
dependencies = [
    "librosa>=0.11,<0.12",
    "matplotlib>=3.10,<3.11",
    "numpy>=2.3,<2.4",
    "pillow>=12.1,<12.2",
    "scikit-learn>=1.8,<1.9",
    "simpleaudio==1.0.4",
    "streamlit>=1.54,<1.55",
    "tqdm>=4.67,<4.68",
]

[dependency-groups]
model = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
]
model-cpu = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frog_classifier"]

[tool.uv]
package = true
link-mode = "copy"
default-groups = ["model"]
conflicts = [[{ group = "model" }, { group = "model-cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", group = "model", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "model-cpu" },
]
torchvision = [
    { index = "pytorch-cu130", group = "model", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "model-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
