schema_version = 2

[audio]
sample_rate_hz = 22050
mono = true
chunk_seconds = 5
overlap_seconds = 0
drop_incomplete_final_chunk = true

[spectrogram]
kind = "mel"
n_mels = 128
fmin_hz = 400
fmax_hz = 4000
power = 2.0
n_fft = 2048
hop_length = 512

[normalization]
reference = "recording"
noise_floor_percentile = 50
db_floor = 0
db_ceiling = 30

[rendering]
format = "png"
bit_depth = 8
low_frequency_at_bottom = true

[classes]
litoria_aurea = 1
non_target = 0
